# cdi configuration for the sample application. Schema: backend/schema/config.schema.json in the cdi tool repository.
# The framework profile supplies the ASP.NET / Angular / SQL Server conventions; this file only says where things are.
version: 1
profile: aspnet-angular-sqlserver

repos:
  - name: web
    path: web
    scanner: {plugin: ts-morph, exclude: ["**/node_modules/**", "**/*.d.ts", "e2e/**"]}
  - name: api
    path: api
    scanner: {plugin: dotnet-roslyn}
  - name: db
    path: db
    scanner: {plugin: sql-scriptdom}

# Files under these folders, or whose first lines carry the marker, were written for the proof of concept (not upstream code).
synthetic:
  path_segments: [synthetic, Synthetic]

branches:
  base: main

risk:
  # placeholder, unvalidated: replace with the real critical objects (glob patterns on object names)
  critical_objects: ["EXAMPLE_ONLY_replace_me*"]
